---
- name: nginx-ui | Fail if distro is not supported
  ansible.builtin.fail:
    msg: "Distribution '{{ ansible_distribution }}' is not supported. Supported: Debian, Ubuntu"
  when: ansible_distribution not in ['Debian', 'Ubuntu']

- name: nginx-ui | Install dependencies
  ansible.builtin.apt:
    name:
      - curl
      - tar
      - nginx
    state: present
    update_cache: true

- name: nginx-ui | Set architecture fact
  ansible.builtin.set_fact:
    nginx_ui_arch: "{{ _arch_map[ansible_architecture] | default('64') }}"
  vars:
    _arch_map:
      x86_64: "64"
      amd64: "64"
      aarch64: "arm64"
      armv7l: "arm"
      armv6l: "arm"

- name: nginx-ui | Check if nginx-ui is already installed
  ansible.builtin.stat:
    path: "{{ nginx_ui_install_dir }}/nginx-ui"
  register: nginx_ui_installed

- name: nginx-ui | Get current installed version
  ansible.builtin.command: "{{ nginx_ui_install_dir }}/nginx-ui -v"
  register: nginx_ui_current_version
  changed_when: false
  failed_when: false
  when: nginx_ui_installed.stat.exists

- name: nginx-ui | Display installation status
  ansible.builtin.debug:
    msg: "nginx-ui is {{ 'installed (version ' + nginx_ui_current_version.stdout | default('unknown') + ')' if nginx_ui_installed.stat.exists else 'not installed' }}."

- name: nginx-ui | Check if update is needed
  ansible.builtin.set_fact:
    nginx_ui_needs_install: "{{ not nginx_ui_installed.stat.exists }}"
    nginx_ui_needs_update: "{{ nginx_ui_installed.stat.exists and (nginx_ui_version not in (nginx_ui_current_version.stdout | default(''))) }}"

- name: nginx-ui | Display version information
  ansible.builtin.debug:
    msg: |
      Current version: {{ nginx_ui_current_version.stdout | default('not installed') }}
      Target version: {{ nginx_ui_version }}
      Needs install: {{ nginx_ui_needs_install }}
      Needs update: {{ nginx_ui_needs_update }}

- name: nginx-ui | Create installation directory
  ansible.builtin.file:
    path: "{{ nginx_ui_install_dir }}"
    state: directory
    owner: "{{ nginx_ui_user }}"
    group: "{{ nginx_ui_group }}"
    mode: "0755"

- name: nginx-ui | Create config directory
  ansible.builtin.file:
    path: "{{ nginx_ui_config_dir }}"
    state: directory
    owner: "{{ nginx_ui_user }}"
    group: "{{ nginx_ui_group }}"
    mode: "0755"

- name: nginx-ui | Create log directory
  ansible.builtin.file:
    path: "{{ nginx_ui_log_dir }}"
    state: directory
    owner: "{{ nginx_ui_user }}"
    group: "{{ nginx_ui_group }}"
    mode: "0755"

- name: nginx-ui | Stop service before update
  ansible.builtin.systemd:
    name: "{{ nginx_ui_service_name }}"
    state: stopped
  when: nginx_ui_needs_update
  failed_when: false

- name: nginx-ui | Download nginx-ui release
  ansible.builtin.get_url:
    url: "https://github.com/0xJacky/nginx-ui/releases/download/{{ nginx_ui_version }}/nginx-ui-linux-{{ nginx_ui_arch }}.tar.gz"
    dest: "/tmp/nginx-ui-linux-{{ nginx_ui_arch }}.tar.gz"
    mode: "0644"
  when: nginx_ui_needs_install or nginx_ui_needs_update

- name: nginx-ui | Extract nginx-ui archive
  ansible.builtin.unarchive:
    src: "/tmp/nginx-ui-linux-{{ nginx_ui_arch }}.tar.gz"
    dest: "{{ nginx_ui_install_dir }}"
    remote_src: true
  when: nginx_ui_needs_install or nginx_ui_needs_update

- name: nginx-ui | Set ownership of installation directory
  ansible.builtin.file:
    path: "{{ nginx_ui_install_dir }}"
    owner: "{{ nginx_ui_user }}"
    group: "{{ nginx_ui_group }}"
    recurse: true
  when: nginx_ui_needs_install or nginx_ui_needs_update

- name: nginx-ui | Set executable permissions
  ansible.builtin.file:
    path: "{{ nginx_ui_install_dir }}/nginx-ui"
    mode: "0755"
  when: nginx_ui_needs_install or nginx_ui_needs_update

- name: nginx-ui | Clean up downloaded archive
  ansible.builtin.file:
    path: "/tmp/nginx-ui-linux-{{ nginx_ui_arch }}.tar.gz"
    state: absent

- name: nginx-ui | Deploy configuration file
  ansible.builtin.template:
    src: app.ini.j2
    dest: "{{ nginx_ui_config_dir }}/app.ini"
    owner: "{{ nginx_ui_user }}"
    group: "{{ nginx_ui_group }}"
    mode: "0640"
  notify: Restart nginx-ui

- name: nginx-ui | Deploy systemd service
  ansible.builtin.template:
    src: nginx-ui.service.j2
    dest: /etc/systemd/system/{{ nginx_ui_service_name }}.service
    owner: root
    group: root
    mode: "0644"
  notify:
    - Reload systemd
    - Restart nginx-ui

- name: nginx-ui | Ensure nginx sites-available directory exists
  ansible.builtin.file:
    path: /etc/nginx/sites-available
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: nginx-ui | Ensure nginx sites-enabled directory exists
  ansible.builtin.file:
    path: /etc/nginx/sites-enabled
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: nginx-ui | Enable and start service
  ansible.builtin.systemd:
    name: "{{ nginx_ui_service_name }}"
    enabled: "{{ nginx_ui_service_enabled }}"
    state: "{{ nginx_ui_service_state }}"
    daemon_reload: true

- name: nginx-ui | Wait for nginx-ui to be ready
  ansible.builtin.uri:
    url: "http://127.0.0.1:{{ nginx_ui_port }}"
    status_code: [200, 302, 403]
  register: nginx_ui_health
  until: nginx_ui_health.status in [200, 302, 403]
  retries: 30
  delay: 2
  when: nginx_ui_needs_install or nginx_ui_needs_update

- name: nginx-ui | Display access information (localhost only)
  ansible.builtin.debug:
    msg: |
      nginx-ui {{ nginx_ui_version }} installed successfully!

      Access (localhost only):
        1. Create SSH tunnel: ssh -L 9000:127.0.0.1:{{ nginx_ui_port }} user@{{ ansible_default_ipv4.address | default(inventory_hostname) }}
        2. Open in browser: http://localhost:9000

      First time setup:
        - Visit the URL above to create admin account

      Config file: {{ nginx_ui_config_dir }}/app.ini
      Log directory: {{ nginx_ui_log_dir }}

      CLI commands:
        systemctl start nginx-ui
        systemctl stop nginx-ui
        systemctl restart nginx-ui
        systemctl status nginx-ui
  when: nginx_ui_localhost_only

- name: nginx-ui | Display access information
  ansible.builtin.debug:
    msg: |
      nginx-ui {{ nginx_ui_version }} installed successfully!

      Access URL: http://{{ ansible_default_ipv4.address | default(inventory_hostname) }}:{{ nginx_ui_port }}

      First time setup:
        - Visit the URL above to create admin account

      Config file: {{ nginx_ui_config_dir }}/app.ini
      Log directory: {{ nginx_ui_log_dir }}

      CLI commands:
        systemctl start nginx-ui
        systemctl stop nginx-ui
        systemctl restart nginx-ui
        systemctl status nginx-ui
  when: not nginx_ui_localhost_only
